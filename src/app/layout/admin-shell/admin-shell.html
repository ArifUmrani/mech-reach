<div class="admin-shell">
  <a class="skip-link" href="#admin-main">Skip to main content</a>
  <header class="admin-header">
    <div class="admin-header-inner">
      <a class="admin-brand" routerLink="/admin/dashboard">MechReach Admin</a>
      <nav class="admin-nav" aria-label="Admin">
        <a routerLink="/admin/dashboard" routerLinkActive="is-active">Dashboard</a>
        <a routerLink="/admin/mechanics" routerLinkActive="is-active">Mechanics</a>
        <a routerLink="/admin/customers" routerLinkActive="is-active">Customers</a>
        <a routerLink="/admin/jobs" routerLinkActive="is-active">Jobs</a>
      </nav>
      <button class="admin-signout" type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>
  <main id="admin-main" class="admin-main">
    <router-outlet />
  </main>
</div>
